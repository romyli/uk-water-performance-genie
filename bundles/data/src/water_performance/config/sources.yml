# Machine-readable source registry. sources.md is the human register; tests check that the two agree.
#
# status:
#   enabled      every acceptance field below is recorded; the source is ingested.
#   conditional  the adapter exists, but each asset is ingested only after its licence is verified
#                (licence_verification on the asset, or evidence found inside the asset itself).
#   hold         not ingested. `hold_reason` says what is missing.
#
# retrieval_mode: api | direct_asset | manual_bootstrap
# Asset-level `status` overrides the source status for that asset only (enabled | conditional | hold).
contract_version: 1

licences:
  CC-BY-4.0:
    name: Creative Commons Attribution 4.0 International
    url: https://creativecommons.org/licenses/by/4.0/
    redistribution: allowed_with_attribution
  OGL-UK-3.0:
    name: Open Government Licence v3.0
    url: https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
    redistribution: allowed_with_attribution

sources:
  - source_id: STREAM_APR
    title: Stream standardised Annual Performance Report datasets
    priority: P0
    status: enabled
    publisher: Stream Water Data Portal (data published by each water company)
    landing_page: https://www.streamwaterdata.co.uk/pages/annual-performance-reports
    jurisdiction: england_wales
    coverage: Participating England and Wales companies, report years 2023-24 onward; items are listed in stream_apr_items.yml
    format: ArcGIS FeatureServer table or CSV item
    retrieval_mode: api
    api:
      item_metadata_url: https://www.arcgis.com/sharing/rest/content/items/{item_id}?f=json
      item_data_url: https://www.arcgis.com/sharing/rest/content/items/{item_id}/data
      discovery_url: https://www.streamwaterdata.co.uk/api/search/v1/collections/dataset/items
      page_size: 1000
    licence:
      id: CC-BY-4.0
      evidence: Checked per item at retrieval; the item licenseInfo must link to creativecommons.org/licenses/by/4.0
    attribution: "Contains {company_name} Annual Performance Report {financial_year} data, published on the Stream Water Data Portal and licensed under CC BY 4.0."
    third_party_rights: None stated on the items registered here.
    reporting_basis: Financial year (April to March) under the RAG 4 table definitions version named in each item's licence text
    contract: stream_apr_v1
    contract_version: 1
    notes: Licence is set per item. Items whose licence is not CC BY 4.0 are recorded and rejected, never ingested.

  - source_id: COMPANY_APR
    title: Company Annual Performance Report data tables
    priority: P0
    status: hold
    hold_reason: Publicly downloadable, but no company workbook registered here carries a reuse licence. Thames Water's website terms reserve all rights and require its prior written consent before content is stored in a retrieval system. Stream copies are used where they exist.
    publisher: Each water company
    landing_page: null
    jurisdiction: england_wales
    coverage: Company-specific Excel tables on Ofwat's APR pro forma template; years vary by company
    format: Excel workbook
    retrieval_mode: direct_asset
    licence:
      id: null
      evidence: Not recorded for any company workbook. Thames Water workbooks contain no licence statement, and https://www.thameswater.co.uk/legal/terms-and-conditions says "All such rights are reserved".
    attribution: null
    third_party_rights: Unknown
    reporting_basis: Financial year under the RAG 4 version stated in each workbook
    contract: company_apr_v1
    contract_version: 1
    notes: >-
      Fallback for company/years missing from Stream. The company_apr_v1 parser reads every table by content and
      produces records shaped like Stream's. Each workbook stays on hold until its publisher's reuse terms are
      recorded; then set the asset's licence_verification and the source licence, and enable it.
    assets:
      - asset_id: tms_apr_tables_2025_26
        release: Thames Water APR tables 2025-26
        company_code: TMS
        financial_year: 2025-26
        report_year_to: 2026
        url: https://www.thameswater.co.uk/media-library/dvrggetx/2025-26-apr-tables.xlsx
        landing_page: https://www.thameswater.co.uk/about-us/performance/regulatory-library
        hold_reason: No reuse licence; Thames Water's terms reserve all rights.
      - asset_id: tms_apr_tables_2024_25
        release: Thames Water APR tables 2024-25 (excluding tables 3A-3I)
        company_code: TMS
        financial_year: 2024-25
        report_year_to: 2025
        url: https://www.thameswater.co.uk/media-library/5s0gwt45/2024-25-annual-performance-report-tables-excluding-tables-3a-3i.xlsx
        landing_page: https://www.thameswater.co.uk/about-us/performance/regulatory-library
        hold_reason: No reuse licence; Thames Water's terms reserve all rights.
      - asset_id: tms_apr_tables_2023_24
        release: Thames Water APR tables 2023-24 (excluding tables 3A-3I, January 2025 update)
        company_code: TMS
        financial_year: 2023-24
        report_year_to: 2024
        url: https://www.thameswater.co.uk/media-library/bglculfn/2023-24-annual-performance-report-tables-excluding-tables-3a-3i-jan-25-updates.xlsx
        landing_page: https://www.thameswater.co.uk/about-us/performance/regulatory-library
        hold_reason: No reuse licence; Thames Water's terms reserve all rights.
      - asset_id: tms_apr_tables_2022_23
        release: Thames Water APR tables 2022-23 (excluding tables 3A-3I, January 2024 update)
        company_code: TMS
        financial_year: 2022-23
        report_year_to: 2023
        url: https://www.thameswater.co.uk/media-library/xvih3h42/2022-23-annual-performance-report-tables-excluding-tables-3a3iv11-updated-jan-2024.xlsx
        landing_page: https://www.thameswater.co.uk/about-us/performance/regulatory-library
        hold_reason: No reuse licence; Thames Water's terms reserve all rights.
      - asset_id: tms_apr_tables_2021_22
        release: Thames Water APR tables 2021-22 (excluding tables 3A-3I)
        company_code: TMS
        financial_year: 2021-22
        report_year_to: 2022
