    format: CSV or Excel workbook in long (normalised) layout
    retrieval_mode: direct_asset
    licence:
      id: OGL-UK-3.0
      evidence: Ofwat states that data on the Water Company Performance Report data pages is released under the Open Government Licence v3.0.
    attribution: "Contains public sector information from Ofwat's Water Company Performance Report {release} licensed under the Open Government Licence v3.0."
    third_party_rights: None stated.
    reporting_basis: Financial year; values as reported to Ofwat for the Water Company Performance Report
    contract: ofwat_wcpr_normalised_v1
