# Inputs that must never be enabled from a private copy. Tests fail if any appears as an enabled source.
forbidden_inputs:
  - name: APR industry datashare workbooks
    reason: No public landing page or reuse licence has been established for these files.
  - name: Private copies of the consolidated PR19 outcomes workbook
    reason: Only the publisher's own copy, retrieved from Ofwat, may be used (see OFWAT_PR19_ODI).
