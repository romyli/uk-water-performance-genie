# Canonical metric crosswalk. Each metric says what it measures, its unit and price base, which way
# is better, and whether companies may be ranked on it. `sources` lists the exact source items that
# report it; a value is mapped only when every stated field matches.
#
# comparability: comparable      companies may be ranked when unit, period, service type and price
#                                base also match (checked per row in Gold)
#                not_comparable  shown for one company or as a trend; never ranked. Say why.
# service_scope: all | water | wastewater (wastewater metrics do not apply to water-only companies)
# regulatory_period: all, or AMP7 when the definition is a PR19 performance commitment
# Rule fields: item_reference, rag_reference, attribute, line_description, unit (as published).
# An attribute may contain {financial_year}, which matches the row's own financial year.
contract_version: 1

metrics:
  # --- Water service: PR19 common performance commitments (AMP7) ---------------------------------
  - metric_id: water_quality_cri
    name: Water quality compliance (CRI)
    theme: Drinking water
    description: Compliance Risk Index score set by the Drinking Water Inspectorate. Lower is better; 0 is full compliance.
    unit: CRI score
    price_base: not_applicable
    direction: lower_is_better
    service_scope: water
    regulatory_period: AMP7
    comparability: comparable
    definition_source: PR19 common performance commitment; Ofwat WCPR item APR3A_01 (RAG 4 table 3A.1)
    synonyms: [CRI, compliance risk index, drinking water quality]
    sources:
      - {source_id: OFWAT_WCPR, item_reference: APR3A_01, unit: no.}

  - metric_id: water_supply_interruptions
    name: Water supply interruptions
    theme: Water service
    description: Average minutes lost per property from interruptions of three hours or more.
    unit: minutes per property
    price_base: not_applicable
    direction: lower_is_better
    service_scope: water
    regulatory_period: AMP7
    comparability: comparable
    definition_source: PR19 common performance commitment; Ofwat WCPR item APR3A_02, published as hh:mm:ss and loaded as minutes
    synonyms: [supply interruptions, interruptions, minutes lost]
    sources:
      - {source_id: OFWAT_WCPR, item_reference: APR3A_02, unit: minutes}

  - metric_id: leakage_reduction_pct
    name: Leakage reduction from the 2019-20 baseline
    theme: Water service
    description: Percentage reduction in three-year-average leakage from the 2019-20 baseline. Higher is better.
    unit: percent
    price_base: not_applicable
    direction: higher_is_better
    service_scope: water
    regulatory_period: AMP7
    comparability: comparable
    definition_source: PR19 common performance commitment; Ofwat WCPR item APR3A_03
    synonyms: [leakage, leakage reduction]
    sources:
      - {source_id: OFWAT_WCPR, item_reference: APR3A_03, unit: "% in no."}

  - metric_id: pcc_reduction_pct
    name: Per capita consumption reduction from the 2019-20 baseline
    theme: Water service
    description: Percentage reduction in three-year-average per capita consumption from the 2019-20 baseline.
    unit: percent
    price_base: not_applicable
    direction: higher_is_better
    service_scope: water
    regulatory_period: AMP7
    comparability: comparable
    definition_source: PR19 common performance commitment; Ofwat WCPR item APR3A_04
    synonyms: [PCC reduction, water use reduction]
    sources:
      - {source_id: OFWAT_WCPR, item_reference: APR3A_04, unit: "% in no."}

  - metric_id: mains_repairs
    name: Mains repairs
    theme: Water service
    description: Mains repairs per 1,000 km of mains.
    unit: repairs per 1,000 km
    price_base: not_applicable
    direction: lower_is_better
    service_scope: water
    regulatory_period: AMP7
    comparability: comparable
    definition_source: PR19 common performance commitment; Ofwat WCPR item APR3A_05
    synonyms: [mains bursts, burst mains]
    sources:
      - {source_id: OFWAT_WCPR, item_reference: APR3A_05, unit: no.}

  - metric_id: unplanned_outage
    name: Unplanned outage
    theme: Water service
    description: Temporary loss of peak week production capacity, as a percentage.
    unit: percent of peak week production capacity
    price_base: not_applicable
    direction: lower_is_better
    service_scope: water
    regulatory_period: AMP7
    comparability: comparable
    definition_source: PR19 common performance commitment; Ofwat WCPR item APR3A_06
    synonyms: [outage]
    sources:
      - {source_id: OFWAT_WCPR, item_reference: APR3A_06, unit: no.}

  - metric_id: drought_restriction_risk
    name: Risk of severe restrictions in a drought
    theme: Resilience
    description: Percentage of the population at risk of severe restrictions in a 1-in-200-year drought.
    unit: percent of population
    price_base: not_applicable
    direction: lower_is_better
    service_scope: water
    regulatory_period: AMP7
    comparability: comparable
    definition_source: PR19 common performance commitment; Ofwat WCPR item APR3E_01
    synonyms: [drought resilience]
    sources:
      - {source_id: OFWAT_WCPR, item_reference: APR3E_01, unit: no.}

  # --- Wastewater: PR19 common performance commitments (AMP7) ------------------------------------
  - metric_id: internal_sewer_flooding
    name: Internal sewer flooding
    theme: Wastewater
    description: Internal sewer flooding incidents per 10,000 sewer connections.
    unit: incidents per 10,000 connections
    price_base: not_applicable
    direction: lower_is_better
    service_scope: wastewater
    regulatory_period: AMP7
    comparability: comparable
    definition_source: PR19 common performance commitment; Ofwat WCPR item APR3B_01
