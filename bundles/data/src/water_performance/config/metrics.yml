    theme: Environment
    description: Category 1 to 3 pollution incidents per 10,000 km of sewer.
    unit: incidents per 10,000 km of sewer
    price_base: not_applicable
    direction: lower_is_better
    service_scope: wastewater
    regulatory_period: AMP7
    comparability: comparable
    definition_source: PR19 common performance commitment; Ofwat WCPR item APR3B_02
    synonyms: [pollution]
    sources:
