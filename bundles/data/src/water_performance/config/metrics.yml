  - metric_id: sewer_collapses
    name: Sewer collapses
    theme: Wastewater
    description: Sewer collapses per 1,000 km of sewer.
    unit: collapses per 1,000 km of sewer
    price_base: not_applicable
    direction: lower_is_better
    service_scope: wastewater
    regulatory_period: AMP7
    comparability: comparable
    definition_source: PR19 common performance commitment; Ofwat WCPR item APR3B_03
    sources:
