  - metric_id: treatment_works_compliance
    name: Treatment works compliance
    theme: Environment
    description: Percentage of permitted sewage and water treatment works compliant with discharge permits.
    unit: percent
    price_base: not_applicable
    direction: higher_is_better
    service_scope: wastewater
    regulatory_period: AMP7
    comparability: comparable
    definition_source: PR19 common performance commitment; Ofwat WCPR item APR3B_04
    sources:
      - {source_id: OFWAT_WCPR, item_reference: APR3B_04, unit: "% in no."}

  - metric_id: sewer_flooding_storm_risk
    name: Risk of sewer flooding in a storm
    theme: Resilience
    description: Percentage of the population at risk of sewer flooding in a 1-in-50-year storm.
    unit: percent of population
    price_base: not_applicable
    direction: lower_is_better
    service_scope: wastewater
    regulatory_period: AMP7
    comparability: comparable
    definition_source: PR19 common performance commitment; Ofwat WCPR item APR3E_05
    sources:
      - {source_id: OFWAT_WCPR, item_reference: APR3E_05, unit: no.}

  # --- Customers ---------------------------------------------------------------------------------
  - metric_id: cmex_score
    name: C-MeX score
    theme: Customers
    description: Customer measure of experience score for residential customers. Higher is better.
    unit: score
    price_base: not_applicable
    direction: higher_is_better
    service_scope: all
    regulatory_period: AMP7
    comparability: comparable
    definition_source: PR19 C-MeX; Ofwat WCPR item APR3C_03
    synonyms: [C-MeX, customer experience, customer satisfaction]
    sources:
      - {source_id: OFWAT_WCPR, item_reference: APR3C_03, unit: no.}

  # --- Water balance (all years) -------------------------------------------------------------------
  - metric_id: per_capita_consumption
    name: Per capita consumption
    theme: Water service
    description: Litres per person per day used by household customers (standardised annual figure).
    unit: litres per person per day
    price_base: not_applicable
    direction: lower_is_better
    service_scope: water
    regulatory_period: all
    comparability: comparable
    definition_source: Ofwat WCPR item APR3F_10 (RAG 4 table 3F.6); Stream table 3F.6 for reconciliation
    synonyms: [PCC, water use per person, consumption]
    sources:
      - {source_id: OFWAT_WCPR, item_reference: APR3F_10, unit: lpd}
      - {source_id: STREAM_APR, rag_reference: "3F.6", attribute: "Performance level | actual ({financial_year})", unit: lpd}

  - metric_id: leakage_ml_per_day
    name: Leakage (annual average)
    theme: Water service
    description: Total leakage in megalitres per day (actual annual figure).
    unit: Ml/d
    price_base: not_applicable
    direction: lower_is_better
    service_scope: water
    regulatory_period: all
    comparability: not_comparable
    comparability_reason: Absolute leakage scales with network size. Rank companies on leakage_reduction_pct instead.
    definition_source: Ofwat WCPR item APR3F_11 (RAG 4 table 3F.5); Stream table 3F.5
    synonyms: [leakage volume]
    sources:
      - {source_id: OFWAT_WCPR, item_reference: APR3F_11, unit: Ml/day}
      - {source_id: STREAM_APR, rag_reference: "3F.5", attribute: "Performance level | actual ({financial_year})", unit: Ml/d}

  - metric_id: connected_properties_water
    name: Properties connected for water supply
    theme: Context
    description: Domestic and non-domestic properties connected for water supply at year end, thousands.
    unit: thousand properties
    price_base: not_applicable
    direction: not_applicable
    service_scope: water
    regulatory_period: all
    comparability: not_comparable
    comparability_reason: A size measure, not performance.
    definition_source: Ofwat WCPR item BN1001 (RAG 4 table 4R.27)
    sources:
      - {source_id: OFWAT_WCPR, item_reference: BN1001, unit: 000s}

  # --- Finance (Stream APR table 1, statutory accounts) -----------------------------------------------
  - metric_id: revenue_statutory
    name: Revenue (statutory)
    theme: Finance
    description: Revenue in the statutory accounts, APR table 1A line 1, GBP million.
    unit: GBP million
    price_base: nominal (outturn)
    direction: not_applicable
    service_scope: all
    regulatory_period: all
    comparability: not_comparable
    comparability_reason: Absolute financial figures scale with company size and accounting choices; compare one company over time.
    definition_source: RAG 4 table 1A.1, attribute Statutory
    synonyms: [revenue, turnover, income]
    sources:
      - {source_id: STREAM_APR, rag_reference: "1A.1", attribute: Statutory, unit: £m}

